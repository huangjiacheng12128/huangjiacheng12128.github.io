<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="文章封面：深紫渐变与代码符号">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15123a"/>
      <stop offset="0.55" stop-color="#3b2f8f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="260" fill="url(#orb1)" filter="url(#soft)"/>
  <circle cx="200" cy="560" r="300" fill="url(#orb2)" filter="url(#soft)"/>

  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="20" letter-spacing="6" fill="#ffffff" fill-opacity="0.42">PERSONAL BLOG · 2026</text>

  <text x="600" y="440" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="300" font-weight="700" fill="#ffffff" fill-opacity="0.14" letter-spacing="-18">&lt;/&gt;</text>

  <line x1="390" y1="510" x2="810" y2="510" stroke="url(#line)" stroke-width="2"/>
  <text x="600" y="565" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="20" letter-spacing="5" fill="#ffffff" fill-opacity="0.55">HELLO, WORLD · 001</text>
</svg>
