<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="48%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="violet" cx="18%" cy="18%" r="58%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="88%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="74%" cy="86%" r="58%">
      <stop offset="0%" stop-color="#db2777" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#violet)"/>
  <rect width="1200" height="900" fill="url(#cyan)"/>
  <rect width="1200" height="900" fill="url(#pink)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <g fill="none" stroke="#ede9fe">
    <circle cx="1010" cy="430" r="300" stroke-opacity=".07"/>
    <circle cx="1010" cy="430" r="380" stroke-opacity=".045"/>
    <circle cx="120" cy="700" r="240" stroke-opacity=".05"/>
  </g>
  <circle cx="1010" cy="430" r="4" fill="#c4b5fd" fill-opacity=".55"/>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="300" font-size="20" letter-spacing="11" fill="#e9d5ff" fill-opacity=".55">HUANGJIACHENG · NOTES</text>
    <line x1="536" y1="342" x2="664" y2="342" stroke="#e9d5ff" stroke-opacity=".22" stroke-width="1"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff" text-anchor="middle">
    <text x="600" y="450" font-size="64" letter-spacing="18" fill-opacity=".95">READ</text>
    <text x="600" y="536" font-size="64" letter-spacing="18" fill-opacity=".88">THINK</text>
    <text x="600" y="622" font-size="64" letter-spacing="18" fill-opacity=".80">BUILD</text>
  </g>

  <line x1="536" y1="674" x2="664" y2="674" stroke="#e9d5ff" stroke-opacity=".20" stroke-width="1"/>
  <text x="600" y="730" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="7" fill="#ddd6fe" fill-opacity=".42">EST. 2026 · PERSONAL NOTES</text>

  <rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
