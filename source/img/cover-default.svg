<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="52%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>

  <circle cx="1020" cy="160" r="230" fill="#a78bfa" fill-opacity=".10"/>
  <circle cx="150" cy="780" r="190" fill="#22d3ee" fill-opacity=".08"/>

  <g font-family="Consolas, 'Courier New', monospace" fill="#ddd6fe">
    <text x="600" y="205" text-anchor="middle" font-size="26" letter-spacing="10" fill-opacity=".72">HUANGJIACHENG · BLOG</text>
    <text x="600" y="540" text-anchor="middle" font-size="260" font-weight="700" fill="#ffffff" fill-opacity=".86">&lt;/&gt;</text>
    <text x="600" y="720" text-anchor="middle" font-size="22" letter-spacing="8" fill-opacity=".60">READ · THINK · BUILD</text>
  </g>

  <rect x="60" y="60" width="1080" height="780" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
</svg>
