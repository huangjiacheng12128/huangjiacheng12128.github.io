# Butterfly 主题配置（只写需要覆盖的项，其余用主题默认值）
# 完整配置：node_modules/hexo-theme-butterfly/_config.yml

favicon: /img/favicon.svg

# 正文字号：14 → 15，整体更易读；想更大改成 16px，想小改回 14px
font:
  global_font_size: 15px
  code_font_size: 14px

# 主题色：紫罗兰，和横幅、头像、封面同一色系
theme_color:
  enable: true
  main: '#7c3aed'
  paginator: '#a78bfa'
  text_selection: '#8b5cf6'
  link_color: '#7c3aed'
  hr_color: '#c4b5fd'
  code_foreground: '#c026d3'
  code_background: '#f4f0ff'
  toc_color: '#8b5cf6'
  blockquote_padding_color: '#8b5cf6'
  blockquote_background_color: '#8b5cf6'
  meta_color: '#8b8aa0'
  button_hover: '#4f46e5'
  scrollbar_color: '#8b5cf6'

nav:
  logo:
  display_title: true
  display_post_title: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  相册: /photos/ || fas fa-camera-retro
  关于: /about/ || fas fa-user

# 社交链接：把下面两行取消注释并改成你自己的地址
# social:
#   fab fa-github: https://github.com/你的用户名 || GitHub || '#24292e'
#   fas fa-envelope: mailto:you@example.com || Email || '#4a7dbe'

avatar:
  img: /img/avatar.svg
  effect: false

# 首页横幅与副标题
default_top_img: /img/banner.svg
index_img: /img/banner.svg
index_top_img_height: 70vh
index_site_info_top: 40%

# 没单独设封面的文章，用这张渐变图当默认封面，避免卡片出现大片空白
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/cover-default.svg

subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 记录技术、读书与生活

# 鼠标丝带：默认关掉，避免在白色正文上留下大块淡色弧线
# 想开启把 enable 改成 true
canvas_ribbon:
  enable: false
  size: 120
  alpha: 0.25
  zIndex: -1
  click_to_change: false
  mobile: false

# 右侧回到顶部显示阅读进度百分比
rightside_scroll_percent: true

# 首页文章摘要：2 = 有 description 用 description，没有就用自动摘要
index_post_content:
  method: 2
  length: 300

# 图片：alt 文字会自动显示成图注；点击图片可放大
photofigcaption: true
lightbox: fancybox

# 本地搜索（无需第三方服务）
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false

# 侧边栏
aside:
  card_author:
    enable: true
    button:
      enable: false
  card_announcement:
    enable: true
    content: '欢迎来到我的博客，这里记录技术、读书与生活。'
  # 网站信息卡：只保留「文章数目」，不显示访客、浏览量、最后更新时间
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: false
    runtime_date:

# 浏览量：关闭（不蒜子服务不稳定，去掉后页面不再显示浏览量）
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 文章目录
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# 代码块
code_blocks:
  theme: light
  macStyle: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true

# 自定义样式（紫罗兰极光视觉）
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
